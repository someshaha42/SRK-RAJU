name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Assemble Debug APK (AGP 9.1.1 / Gradle 9.3.1 / Kotlin 2.2.10 / JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x FrameCutUI/gradlew

      - name: Verify Java, Gradle, and modules
        working-directory: FrameCutUI
        run: |
          java -version
          ./gradlew --version --no-daemon
          ./gradlew projects --no-daemon

      - name: Build Debug APK
        working-directory: FrameCutUI
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify non-empty Debug APK
        working-directory: FrameCutUI
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: framecut-debug-apk
          path: FrameCutUI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
