name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run unit tests before building APK"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "Publish Debug APK to GitHub Releases"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK (AGP 9.1.1 / Gradle 9.3.1 / Kotlin 2.2.10 / JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          javac -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDK_MGR="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Verify project modules and wrapper
        working-directory: FrameCutUI
        run: |
          chmod +x gradlew
          ./gradlew --version --no-daemon
          ./gradlew projects --no-daemon

      - name: Run unit tests
        if: ${{ inputs.run_tests == true }}
        working-directory: FrameCutUI
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        working-directory: FrameCutUI
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon --parallel --build-cache

      - name: Verify debug APK
        working-directory: FrameCutUI
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: framecut-debug-apk
          path: FrameCutUI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish_release == true) }}
        run: |
          mkdir -p release-assets
          cp FrameCutUI/app/build/outputs/apk/debug/app-debug.apk \
            "release-assets/FrameCut-debug-build-${{ github.run_number }}.apk"
          ls -lh release-assets/

      - name: Publish APK to GitHub Releases
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish_release == true) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="debug-build-${{ github.run_number }}"
          ASSET_FILE="release-assets/FrameCut-debug-build-${{ github.run_number }}.apk"
          gh release create "$TAG_NAME" "$ASSET_FILE" \
            --title "FrameCut Debug APK #${{ github.run_number }}" \
            --notes "Automated Debug APK build (AGP 9.1.1, Gradle 9.3.1, Kotlin 2.2.10, JDK 17)." \
            --prerelease

      - name: Report APK download result
        if: always()
        run: |
          {
            echo "## FrameCut Debug APK Build Summary"
            echo "- **Build Status:** ${{ job.status }}"
            echo "- **Toolchain:** AGP 9.1.1 | Gradle 9.3.1 | Kotlin 2.2.10 | JDK 17"
            echo "- **Artifact:** \`framecut-debug-apk\` (\`FrameCutUI/app/build/outputs/apk/debug/app-debug.apk\`)"
            if [ "${{ github.event_name }}" != "pull_request" ] && { [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.publish_release }}" = "true" ]; }; then
              echo "- **GitHub Release Tag:** \`debug-build-${{ github.run_number }}\` (downloadable directly from Releases in the GitHub app)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
